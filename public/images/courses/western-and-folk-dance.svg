<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Dancer Silhouette / Pose -->
    <circle cx="0" cy="-30" r="9" fill="#9333ea"/>
    <!-- Dancer Body -->
    <path d="M-4,-20 L4,-20 L8,2 L-8,2 Z" fill="#a855f7"/>
    <!-- Graceful Arms -->
    <path d="M-18,-35 Q-12,-15 0,-20 Q12,-15 25,-12" fill="none" stroke="#9333ea" stroke-width="4" stroke-linecap="round"/>
    <!-- Flowing Dress / Skirt -->
    <path d="M-8,2 C-28,25 -20,38 0,32 C20,38 28,25 8,2 Z" fill="#c084fc" stroke="#7e22ce" stroke-width="2.5"/>
    <!-- Musical Swirls -->
    <path d="M-35,10 Q-25,-10 -15,-5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M35,-5 Q25,10 15,5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    </g>
</svg>