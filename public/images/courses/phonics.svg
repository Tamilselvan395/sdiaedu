<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Open Book -->
    <path d="M-45,18 C-25,10 -5,12 0,16 C5,12 25,10 45,18 L48,-18 C28,-26 8,-24 0,-20 C-8,-24 -28,-26 -48,-18 Z" fill="#ffffff" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-45,18 C-25,10 -5,12 0,16 L0,-20" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-38,-10 L-10,-6 M-38,-2 L-10,2 M-38,6 L-10,10" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <!-- 3D Letter Blocks -->
    <g transform="translate(-18, -26)">
        <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
    </g>
    <g transform="translate(18, -28)">
        <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
        <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
    </g>
    <g transform="translate(0, -42)">
        <rect x="-12" y="-12" width="24" height="24" rx="5" fill="#10b981" stroke="#047857" stroke-width="2"/>
        <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    </g>

    </g>
</svg>