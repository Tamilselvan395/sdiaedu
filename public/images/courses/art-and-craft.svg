<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Craft Paper -->
    <rect x="-35" y="-20" width="50" height="55" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <!-- Origami Crane/Boat -->
    <polygon points="-10,-10 25,-10 8,15" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <polygon points="-10,-10 8,15 -18,15" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
    <!-- Scissors -->
    <g transform="translate(20, -10) rotate(25)">
        <circle cx="-8" cy="-22" r="7" fill="none" stroke="#8b5cf6" stroke-width="3"/>
        <circle cx="8" cy="-22" r="7" fill="none" stroke="#8b5cf6" stroke-width="3"/>
        <line x1="-5" y1="-15" x2="8" y2="18" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="5" y1="-15" x2="-8" y2="18" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="0" cy="-3" r="2.5" fill="#475569"/>
    </g>

    </g>
</svg>