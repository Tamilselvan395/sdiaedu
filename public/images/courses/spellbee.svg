<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#eab308" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Bee Body -->
    <ellipse cx="0" cy="5" rx="26" ry="32" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
    <path d="M-22,-6 L22,-6 M-25,6 L25,6 M-20,18 L20,18" stroke="#713f12" stroke-width="5" stroke-linecap="round"/>
    <!-- Wings -->
    <ellipse cx="-22" cy="-20" rx="18" ry="12" fill="#e0f2fe" opacity="0.85" stroke="#38bdf8" stroke-width="2" transform="rotate(-25, -22, -20)"/>
    <ellipse cx="22" cy="-20" rx="18" ry="12" fill="#e0f2fe" opacity="0.85" stroke="#38bdf8" stroke-width="2" transform="rotate(25, 22, -20)"/>
    <!-- Antennae -->
    <path d="M-8,-26 Q-16,-38 -22,-36 M8,-26 Q16,-38 22,-36" fill="none" stroke="#713f12" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-22" cy="-36" r="3" fill="#ca8a04"/>
    <circle cx="22" cy="-36" r="3" fill="#ca8a04"/>
    <!-- Letters -->
    <text x="-40" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="extrabold" fill="#f59e0b">S</text>
    <text x="32" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="extrabold" fill="#0ea5e9">P</text>
    <text x="24" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="extrabold" fill="#10b981">E</text>
    <text x="-34" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="extrabold" fill="#ec4899">L</text>

    </g>
</svg>