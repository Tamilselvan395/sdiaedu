<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Chat Bubble 1 -->
    <path d="M-40,-25 C-40,-40 -5,-40 10,-25 C25,-10 15,10 -15,10 L-25,22 L-22,10 C-35,10 -40,-5 -40,-25 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <!-- Globe/English flag motif inside bubble -->
    <circle cx="-15" cy="-15" r="14" fill="#3b82f6"/>
    <line x1="-15" y1="-29" x2="-15" y2="-1" stroke="#ffffff" stroke-width="3"/>
    <line x1="-29" y1="-15" x2="-1" y2="-15" stroke="#ffffff" stroke-width="3"/>
    <!-- Chat Bubble 2 -->
    <path d="M-5,5 C10,5 35,5 40,20 C45,32 30,45 10,45 L0,55 L3,45 C-5,45 -10,35 -5,5 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="18" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Hi!</text>

    </g>
</svg>