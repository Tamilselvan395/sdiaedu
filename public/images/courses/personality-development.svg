<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Stage Podium -->
    <polygon points="-32,32 32,32 24,15 -24,15" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
    <rect x="-6" y="-5" width="12" height="22" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <!-- Microphone Head -->
    <rect x="-14" y="-35" width="28" height="32" rx="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
    <line x1="-12" y1="-24" x2="12" y2="-24" stroke="#64748b" stroke-width="2"/>
    <line x1="-12" y1="-16" x2="12" y2="-16" stroke="#64748b" stroke-width="2"/>
    <!-- Sound Waves -->
    <path d="M-22,-30 C-30,-25 -30,-12 -22,-6" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,-30 C30,-25 30,-12 22,-6" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Stars -->
    <polygon points="0,-48 3,-40 11,-40 5,-35 7,-27 0,-31 -7,-27 -5,-35 -11,-40 -3,-40" fill="#fbbf24"/>

    </g>
</svg>