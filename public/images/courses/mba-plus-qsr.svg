<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d97706" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Cloche / Serving Platter -->
    <path d="M-36,15 C-36,-15 36,-15 36,15 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="-18" r="4.5" fill="#475569"/>
    <rect x="-42" y="15" width="84" height="6" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- Chef Hat on top -->
    <g transform="translate(0, -28)">
        <path d="M-15,5 C-22,-4 -12,-16 0,-15 C12,-16 22,-4 15,5 Z" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
        <rect x="-12" y="3" width="24" height="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    </g>
    <!-- Business Chart -->
    <path d="M-20,0 L-6,-8 L6,-2 L20,-12" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

    </g>
</svg>