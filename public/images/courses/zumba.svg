<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Athletic Sneaker/Footwear -->
    <path d="M-35,18 C-35,5 -20,5 -10,0 C2,-6 15,-15 28,-15 C38,-15 42,2 40,18 Z" fill="#f43f5e" stroke="#be123c" stroke-width="3"/>
    <path d="M-35,18 L40,18 L42,26 L-37,26 Z" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <line x1="0" y1="2" x2="15" y2="-4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-5" y1="8" x2="10" y2="2" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Musical Energy Notes -->
    <g transform="translate(8, -25)">
        <ellipse cx="-8" cy="5" rx="5" ry="4" fill="#f59e0b"/>
        <ellipse cx="8" cy="2" rx="5" ry="4" fill="#f59e0b"/>
        <line x1="-4" y1="5" x2="-4" y2="-15" stroke="#f59e0b" stroke-width="3"/>
        <line x1="12" y1="2" x2="12" y2="-18" stroke="#f59e0b" stroke-width="3"/>
        <polygon points="-4,-15 12,-18 12,-12 -4,-9" fill="#f59e0b"/>
    </g>
    <!-- Pulse Line -->
    <path d="M-42,-2 L-26,-2 L-18,-16 L-10,12 L-2,-2 L15,-2" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    </g>
</svg>