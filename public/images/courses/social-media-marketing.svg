<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Smartphone -->
    <rect x="-24" y="-36" width="48" height="72" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="-20" y="-30" width="40" height="58" rx="4" fill="#ffffff"/>
    <!-- Rocket launching -->
    <g transform="translate(18, -12) rotate(45)">
        <ellipse cx="0" cy="0" rx="10" ry="20" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <circle cx="0" cy="-4" r="4" fill="#38bdf8"/>
        <!-- Rocket Flame -->
        <polygon points="-6,18 6,18 0,30" fill="#f59e0b"/>
    </g>
    <!-- Growth Chart Bars -->
    <rect x="-16" y="8" width="6" height="12" fill="#38bdf8" rx="1"/>
    <rect x="-8" y="2" width="6" height="18" fill="#ec4899" rx="1"/>
    <rect x="0" y="-6" width="6" height="26" fill="#10b981" rx="1"/>

    </g>
</svg>