<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#059669" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Wooden Stacking Rainbow / Shapes -->
    <path d="M-40,25 C-40,-15 40,-15 40,25" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <path d="M-28,25 C-28,-2 28,-2 28,25" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <path d="M-16,25 C-16,8 16,8 16,25" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Graduation Cap on top -->
    <g transform="translate(0, -22)">
        <polygon points="0,-12 25,-2 0,8 -25,-2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
        <line x1="20" y1="0" x2="20" y2="15" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="20" cy="16" r="2.5" fill="#f59e0b"/>
    </g>

    </g>
</svg>