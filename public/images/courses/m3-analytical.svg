<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Lightbulb glowing -->
    <path d="M-22,-15 C-22,-32 22,-32 22,-15 C22,-5 12,2 10,12 L-10,12 C-12,2 -22,-5 -22,-15 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <rect x="-8" y="14" width="16" height="5" fill="#94a3b8" rx="2"/>
    <rect x="-6" y="20" width="12" height="4" fill="#64748b" rx="2"/>
    <!-- Gear on the side -->
    <g transform="translate(-25, 12)">
        <circle cx="0" cy="0" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
        <circle cx="0" cy="0" r="5" fill="#0284c7"/>
    </g>
    <g transform="translate(25, 12)">
        <circle cx="0" cy="0" r="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
        <circle cx="0" cy="0" r="5" fill="#9333ea"/>
    </g>
    <!-- Filament -->
    <path d="M-6,0 L0,-12 L6,0" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>

    </g>
</svg>