<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Paper Sheet -->
    <rect x="-35" y="-30" width="70" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-22" y1="-12" x2="22" y2="-12" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="2" x2="22" y2="2" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="16" x2="22" y2="16" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-22" y1="30" x2="5" y2="30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <!-- Fountain Pen -->
    <g transform="translate(10, -5) rotate(-35)">
        <rect x="-6" y="-45" width="12" height="50" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
        <polygon points="-6,5 6,5 0,22" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
        <line x1="0" y1="5" x2="0" y2="16" stroke="#b45309" stroke-width="1.5"/>
        <circle cx="0" cy="11" r="1.5" fill="#1e293b"/>
        <!-- Ring -->
        <rect x="-7" y="-2" width="14" height="4" fill="#fbbf24"/>
    </g>
    <!-- Script swoosh -->
    <path d="M-18,22 Q0,10 12,25 Q20,32 30,18" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>

    </g>
</svg>