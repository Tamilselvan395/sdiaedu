<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Isometric Cube Faces -->
    <!-- Top Face -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="#facc15" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-14" y1="-32" x2="28" y2="-8" stroke="#1e293b" stroke-width="2"/>
    <line x1="-28" y1="-16" x2="14" y2="8" stroke="#1e293b" stroke-width="2"/>
    <line x1="14" y1="-40" x2="-28" y2="-16" stroke="#1e293b" stroke-width="2"/>
    <line x1="28" y1="-32" x2="-14" y2="-8" stroke="#1e293b" stroke-width="2"/>
    <!-- Left Face (Blue/Cyan) -->
    <polygon points="-42,-24 0,0 0,48 -42,24" fill="#0284c7" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-28" y1="-8" x2="-28" y2="40" stroke="#1e293b" stroke-width="2"/>
    <line x1="-14" y1="8" x2="-14" y2="56" stroke="#1e293b" stroke-width="2"/>
    <line x1="-42" y1="-8" x2="0" y2="16" stroke="#1e293b" stroke-width="2"/>
    <line x1="-42" y1="8" x2="0" y2="32" stroke="#1e293b" stroke-width="2"/>
    <!-- Right Face (Red/Orange) -->
    <polygon points="0,0 42,-24 42,24 0,48" fill="#ef4444" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="14" y1="8" x2="14" y2="56" stroke="#1e293b" stroke-width="2"/>
    <line x1="28" y1="-8" x2="28" y2="40" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="16" x2="42" y2="-8" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="32" x2="42" y2="8" stroke="#1e293b" stroke-width="2"/>
    <!-- Speed Motion Trails -->
    <path d="M-48,0 C-58,-15 -50,-35 -30,-42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M48,0 C58,15 50,35 30,42" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    </g>
</svg>