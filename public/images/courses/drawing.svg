<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <!-- Sketchpad -->
    <rect x="-42" y="-36" width="75" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M-28,-18 C-10,-30 10,-5 20,-20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M-28,10 C-10,-5 15,20 22,5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <!-- Drawing Pencils -->
    <g transform="translate(18, 12) rotate(-45)">
        <rect x="-6" y="-35" width="12" height="45" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
        <polygon points="-6,10 6,10 0,24" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>
        <polygon points="-2,19 2,19 0,24" fill="#1e293b"/>
        <rect x="-6" y="-42" width="12" height="7" fill="#f43f5e" rx="1"/>
    </g>
    <!-- Compass/Ruler -->
    <polygon points="-35,25 -20,25 -35,10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

    </g>
</svg>