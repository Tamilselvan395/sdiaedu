<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
        </filter>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Subtle Background Ambient -->
    <circle cx="100" cy="75" r="68" fill="url(#bgGrad)" />

    <!-- Sparkles -->
    <path d="M40,25 L42,19 L48,17 L42,15 L40,9 L38,15 L32,17 L38,19 Z" fill="#fbbf24" opacity="0.8" />
    <path d="M165,30 L166,25 L171,23 L166,21 L165,16 L164,21 L159,23 L164,25 Z" fill="#fbbf24" opacity="0.7" />
    <circle cx="160" cy="115" r="3" fill="#38bdf8" opacity="0.6" />
    <circle cx="35" cy="105" r="2.5" fill="#f43f5e" opacity="0.6" />

    <!-- Main 3D Icon Graphic -->
    <g filter="url(#dropShadow)" transform="translate(100, 75) scale(1.35)">
        
    <circle cx="0" cy="0" r="52" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="0,-42 36,22 -36,22" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="0,42 36,-22 -36,-22" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <!-- Lightning Bolt -->
    <polygon points="4,-16 -12,4 -1,4 -6,18 14,-2 3,-2" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" filter="url(#softGlow)"/>
    <!-- Floating Math Symbols -->
    <text x="-36" y="-22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">∑</text>
    <text x="25" y="-22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">√</text>
    <text x="-38" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">×</text>
    <text x="28" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ec4899">∞</text>

    </g>
</svg>